plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = 'itembingo-fabric'
}

// Client-only mod: a dedicated-server dev run is useless here, and Loom's
// `runServer` task would collide with the root project's run-paper task
// whenever `./gradlew runServer` is invoked without a project path.
tasks.matching { it.name == 'runServer' }.configureEach {
    enabled = false
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
