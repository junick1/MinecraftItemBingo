plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.1";
    id "com.gradleup.shadow" version "9.2.0";
}

group = 'me.junick'
version = '26.2-webui-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")

    implementation("io.javalin:javalin:6.1.3")
    implementation("org.slf4j:slf4j-simple:2.0.7")
    implementation('com.google.code.gson:gson:2.10.1')
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.2")
    }

    // 3. 빌드 시 run-paper가 shadowJar 결과물을 인식하고 서버를 실행하도록 연결
    shadowJar {
        // 다른 플러그인과의 충돌을 막기 위해 패키지 경로를 재배치(Relocation)하는 것이 아주 안전합니다!
        archiveClassifier.set('')
        relocate 'io.javalin', 'me.junick.libs.javalin'
        relocate 'org.eclipse.jetty', 'me.junick.libs.jetty'
    }
}

build {
    dependsOn(tasks.shadowJar)
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'

    filesMatching("plugin.yml") {
        expand props
    }
}
