name: ItemBingo
version: '26.2-SNAPSHOT'
main: me.junick.itemBingo.ItemBingo
api-version: '1.21'
commands:
  rollbingo:
    description: Start a new bingo game
    usage: /rollbingo <width> <height>
    permission: itembingo.command.rollbingo
    permission-message: You do not have permission to use this command.
  newbingo:
    description: Roll and save a board as a reusable preset
    usage: /newbingo <id> <width> <height>
    permission: itembingo.command.newbingo
    permission-message: You do not have permission to use this command.
  setbingo:
    description: Apply a saved board preset (GUI, or directly by id)
    usage: /setbingo [id]
    permission: itembingo.command.setbingo
    permission-message: You do not have permission to use this command.
  editbingo:
    description: Edit a saved board preset in-game (GUI picker, or directly by id)
    usage: /editbingo [id]
    permission: itembingo.command.editbingo
    permission-message: You do not have permission to use this command.
  menu:
    description: Open Bingo main menu
    usage: /menu
  chest:
    description: Open your team/private storage chest
    usage: /chest
  tpa:
    description: Request to teleport to a teammate
    usage: /tpa <player>
  tpaccept:
    description: Accept a pending teleport request
    usage: /tpaccept [player]
  tpdeny:
    description: Reject a pending teleport request
    usage: /tpdeny [player]
  bingo:
    description: View the bingo board
    usage: /bingo
  timer:
    description: Timer utilities
    usage: /timer <start|stop|reset> [seconds]
    permission: itembingo.command.timer
    permission-message: You do not have permission to use this command.
  rank:
    description: View rankings
    usage: /rank
  summary:
    description: View the results of the last game (when the timer is inactive)
    usage: /summary
  shop:
    description: Open shop
    usage: /shop
  startbingo:
    description: Start the bingo game
    usage: /startbingo <seconds>
    permission: itembingo.command.startbingo
    permission-message: You do not have permission to use this command.
  teams:
    description: args
    usage: /teams <args...>
    permission: itembingo.command.teams
    permission-message: You do not have permission to use this command.
  teammate:
    description: Check teammates
    usage: /teammate
  language:
    description: Set your display language
    usage: /language <english|korean|auto>
    aliases: [lang]
  chat:
    description: Set your default chat channel (team/all)
    usage: /chat <team|t|all|a>
  ac:
    description: Send a one-off message to all chat
    usage: /ac <message>
  tc:
    description: Send a one-off message to team chat
    usage: /tc <message>
  admin:
    description: Open ItemBingo admin panel
    usage: /admin
    permission: itembingo.admin
  pointadd:
    description: pointadd
    usage: /pointadd <player> <diamond|line|slot> <amount>
    permission: itembingo.command.point
    permission-message: You do not have permission to use this command.
  customitem:
    description: customitem
    usage: /customitem
    permission: itembingo.command.customitem
    permission-message: You do not have permission to use this command.
  bundle:
    description: bundle
    usage: /bundle
  setbundle:
    description: setbundle
    usage: /setbundle
    permission: itembingo.command.setbundle
    permission-message: You do not have permission to use this command.